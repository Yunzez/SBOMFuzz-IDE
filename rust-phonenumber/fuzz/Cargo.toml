[package]
name = "phonenumber-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[profile.release]
panic = "abort"
debug-assertions = true
overflow-checks = true
lto = "off"
codegen-units = 1

[dependencies]
libfuzzer-sys = {version = "0.15.4", package = "libafl_libfuzzer"}
arbitrary = { version = "1.4.2", features = ["derive"] } 
bincode = "1.3"
either = "1.8"
fnv = "1.0"
itertools = ">=0.10, <=0.11"
lazy_static = "1.4"
nom = "7.1"
quick-xml = "0.28"
regex = "1.7"
regex-cache = "0.2"
serde = "1.0"
serde_derive = "1.0"
strum = { version = "0.24", features = ["derive"] }
thiserror = "1.0"
# libfuzzer-sys = {version = "0.4"}

# libfuzzer-sys = { git = "https://github.com/AFLplusplus/LibAFL.git", features = ["arbitrary-derive"], package = "libafl_libfuzzer" }

[dependencies.phonenumber]
path = ".."




[[bin]]
name = "fuzz_target_phone_number"
path = "fuzz_targets/fuzz_target_phone_number.rs"
test = false
doc = false
bench = false