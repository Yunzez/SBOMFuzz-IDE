<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="${webviewUri}/webview.css" rel="stylesheet" />
  </head>
  <body>
    <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px">
      SBOMFuzz Dashboard
    </div>
    <div style="display: flex; justify-content: flex-start; align-items: center;">
      <div id="path-display-container"></div>
      <button class="menu-button" id="refresh-button">Refresh</button>
    </div>

    <!-- <button class="menu-button" id="clear-button">Clear</button>
    <button class="menu-button" id="start-analyzer">Run Analyzer</button> -->
    <div class="collapsible-section">
      <div class="collapsible-header">Function Details</div>
      <div class="collapsible-content">
        <div class="container" id="entry-list"></div>
      </div>
    </div>
    <div id="fuzz-path-display"></div>
    <div class="collapsible-section">
      <div class="collapsible-header">Harness Details</div>
      <div class="collapsible-content">
        <div class="container" id="harness-list"></div>
      </div>
    </div>

    <script src="${webviewUri}/webview.js"></script>
  </body>
</html>
